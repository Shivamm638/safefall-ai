<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SafeFall browser camera</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent;
               font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: relative; border-radius: 14px; overflow: hidden;
          background: #0B1220; border: 1px solid #1E2A3C; }
  video { width: 100%; display: block; background: #0B1220; }
  video.mirrored { transform: scaleX(-1); }
  #notice { position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; text-align: center; padding: 1.2rem;
            color: #9FB2CC; font-size: .92rem; line-height: 1.5; }
  #notice.hidden { display: none; }
  #badge { position: absolute; left: 10px; top: 10px; padding: 3px 9px;
           border-radius: 999px; font-size: .72rem; letter-spacing: .04em;
           background: rgba(11,18,32,.78); color: #2DD4BF; border: 1px solid #234; }
  #badge.off { color: #9FB2CC; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="badge" class="off">CAMERA OFF</div>
  <div id="notice">Turn <b>&nbsp;Camera on&nbsp;</b> above and allow access when your browser asks.</div>
</div>
<canvas id="canvas" style="display:none"></canvas>

<script>
/*
 * Streams webcam frames to the Streamlit script over the component channel.
 *
 * The point of doing it this way is that it needs no WebRTC, and therefore no
 * STUN/TURN relay: frames ride the websocket the app already uses, which works
 * on a deployed host with no configuration at all.
 *
 * The loop is driven by Streamlit itself. Handing a value back triggers a
 * rerun, the rerun re-renders this component, and that render is what asks for
 * the next frame. The capture rate is therefore whatever the server can
 * actually keep up with - no queue can build up, and a slow host simply
 * produces a slower stream instead of falling behind.
 */
(function () {
  var video   = document.getElementById("video");
  var canvas  = document.getElementById("canvas");
  var notice  = document.getElementById("notice");
  var badge   = document.getElementById("badge");

  var stream = null, running = false, starting = false;
  var seq = 0, args = {}, lastCapture = 0, timer = null;
  var inFlight = false;          // a frame is with the server, awaiting its ack

  function post(type, extra) {
    var message = { isStreamlitMessage: true, type: type };
    if (extra) { for (var k in extra) message[k] = extra[k]; }
    window.parent.postMessage(message, "*");
  }
  function setHeight() {
    post("streamlit:setFrameHeight", { height: document.body.scrollHeight });
  }
  function setValue(value) {
    post("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function show(text) {
    notice.innerHTML = text;
    notice.classList.remove("hidden");
  }

  async function start() {
    if (stream || starting) return;
    starting = true;
    show("Starting camera&hellip;");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      notice.classList.add("hidden");
      badge.textContent = "● LIVE";
      badge.classList.remove("off");
    } catch (err) {
      var name = (err && err.name) ? err.name : String(err);
      var hint = name === "NotAllowedError"
        ? "Camera permission was refused. Allow it in the address bar, then switch the camera on again."
        : (name === "NotFoundError"
            ? "No camera was found on this device."
            : "The browser could not open the camera.");
      show("<b>" + name + "</b><br>" + hint);
      setValue({ error: name, seq: ++seq });
    } finally {
      starting = false;
      setHeight();
    }
  }

  function stop() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
    badge.textContent = "CAMERA OFF";
    badge.classList.add("off");
    show("Camera stopped.");
    setHeight();
  }

  function capture() {
    if (!running || !stream) return;
    if (video.readyState < 2 || !video.videoWidth) {   // not yet producing pixels
      setTimeout(capture, 120);
      return;
    }
    // Never outrun the minimum interval, even if renders arrive in a burst.
    var wait = (args.min_interval_ms || 120) - (Date.now() - lastCapture);
    if (wait > 0) {
      clearTimeout(timer);
      timer = setTimeout(capture, wait);
      return;
    }
    lastCapture = Date.now();

    var target = args.width || 480;
    var scale = target / video.videoWidth;
    canvas.width = target;
    canvas.height = Math.round(video.videoHeight * scale);

    var ctx = canvas.getContext("2d");
    if (args.mirror !== false) {
      // Draw mirrored so the frame Python sees matches what the user sees.
      ctx.setTransform(-1, 0, 0, 1, canvas.width, 0);
    } else {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    inFlight = true;
    setValue({
      frame: canvas.toDataURL("image/jpeg", args.quality || 0.6),
      seq: ++seq,
      width: canvas.width,
      height: canvas.height
    });
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    args = event.data.args || {};
    video.className = (args.mirror === false) ? "" : "mirrored";

    // `ack` is the sequence number the script has finished analysing. Seeing
    // our own last frame come back is what releases the next one, so exactly
    // one frame is ever in flight and a slow host simply slows the stream
    // instead of accumulating a backlog.
    if (args.ack === seq) inFlight = false;

    var want = !!args.running;
    if (want && !running) {
      running = true;
      inFlight = false;
      start().then(function () { setTimeout(capture, 250); });
    } else if (!want && running) {
      running = false;
      inFlight = false;
      stop();
    } else if (running && !inFlight) {
      capture();                       // the ack is the loop's clock
    }
    setHeight();
  });

  // Safety net: if an ack never arrives - a dropped rerun, a transient server
  // error - resume rather than leaving the picture frozen.
  setInterval(function () {
    if (running && stream && Date.now() - lastCapture > 2500) {
      inFlight = false;
      capture();
    }
  }, 1000);

  post("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
})();
</script>
</body>
</html>
